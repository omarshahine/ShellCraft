name: Release

# Tag-driven. `release.sh` remains the local path and does the same steps; this
# workflow exists so a release can be cut without a configured Mac. Both produce
# the same three artifacts: the notarized zip, the appcast, and the GitHub
# release that Sparkle's feed URL resolves against.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: ShellCraft
  PROJECT: ShellCraft.xcodeproj
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  SPARKLE_VERSION: "2.9.6"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # The tag is the source of truth. If project.yml disagrees, the built
          # app would advertise a version the appcast does not, and Sparkle
          # would offer an update that installs as the same version forever.
          IN_YML=$(grep 'MARKETING_VERSION:' project.yml | head -1 | sed 's/.*: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/')
          if [[ "$IN_YML" != "$VERSION" ]]; then
            echo "::error::Tag is v${VERSION} but project.yml says ${IN_YML}."
            exit 1
          fi
          echo "build=$(grep 'CURRENT_PROJECT_VERSION:' project.yml | head -1 | sed 's/.*: *\([0-9]*\)/\1/')" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --quiet
          # Icon Composer folder reference: XcodeGen emits `folder`, Xcode needs
          # `folder.iconcomposer.icon` or the app ships without its icon.
          sed -i '' 's|lastKnownFileType = folder; name = ShellCraft.icon; path = ShellCraft/ShellCraft.icon; sourceTree = SOURCE_ROOT;|lastKnownFileType = folder.iconcomposer.icon; path = ShellCraft.icon; sourceTree = "<group>";|' "${PROJECT}/project.pbxproj"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm -f /tmp/certificate.p12
          security find-identity -v -p codesigning build.keychain

      - name: Archive
        run: |
          xcodebuild archive \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "build/${SCHEME}.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/${SCHEME}.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist ExportOptions.plist
          codesign --verify --deep --strict "build/export/${SCHEME}.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/${SCHEME}.app" "build/notarize.zip"
          xcrun notarytool submit "build/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "build/export/${SCHEME}.app"
          xcrun stapler validate "build/export/${SCHEME}.app"

      - name: Package
        id: package
        run: |
          mkdir -p Releases
          ZIP="Releases/${SCHEME}-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/export/${SCHEME}.app" "$ZIP"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -f%z "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Sign for Sparkle and build the appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          ZIP: ${{ steps.package.outputs.zip }}
          LENGTH: ${{ steps.package.outputs.length }}
        run: |
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          # Key arrives on stdin: never an argv entry, never the keychain.
          SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | /tmp/sparkle/bin/sign_update -f - -p "$ZIP")
          if [[ -z "$SIGNATURE" ]]; then
            echo "::error::Sparkle signing produced no signature"
            exit 1
          fi
          PUBDATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")
          BASE="https://github.com/omarshahine/ShellCraft/releases"
          cat > Releases/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>ShellCraft</title>
                  <link>${BASE}/latest/download/appcast.xml</link>
                  <description>Updates for ShellCraft</description>
                  <language>en</language>
                  <item>
                      <title>${VERSION}</title>
                      <pubDate>${PUBDATE}</pubDate>
                      <sparkle:version>${BUILD}</sparkle:version>
                      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                      <sparkle:releaseNotesLink>${BASE}/tag/v${VERSION}</sparkle:releaseNotesLink>
                      <enclosure url="${BASE}/download/v${VERSION}/$(basename "$ZIP")"
                                 length="${LENGTH}"
                                 type="application/octet-stream"
                                 sparkle:edSignature="${SIGNATURE}" />
                  </item>
              </channel>
          </rss>
          APPCAST
          # The heredoc above is indented for readability; strip it back out.
          sed -i '' 's/^          //' Releases/appcast.xml
          # A malformed feed silently stops every installed copy from ever
          # seeing another update, so prove it parses before publishing.
          xmllint --noout Releases/appcast.xml

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            Releases/appcast.xml
          generate_release_notes: true
          fail_on_unmatched_files: true
